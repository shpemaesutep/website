    /* ===================================================
       RENDER
       =================================================== */
    function leaderCardHTML(leader) {
      const photoStyles = [
        leader.photoPosition ? `object-position: ${leader.photoPosition};` : "",
        leader.photoTransform ? `transform: ${leader.photoTransform};` : "",
        leader.photoTransformOrigin ? `transform-origin: ${leader.photoTransformOrigin};` : ""
      ].filter(Boolean).join(" ");
      const photoStyle = photoStyles ? ` style="${photoStyles}"` : "";
      const imgTag = leader.img
        ? `<img class="leader-card__photo" data-src="${leader.img}" alt="${leader.name}" loading="lazy" decoding="async"${photoStyle}>`
        : `<div class="avatar-placeholder"><i class="fa-solid fa-user" aria-hidden="true"></i></div>`;

      const linkedIn = leader.linkedin
        ? `<a class="leader-card__linkedin" href="${leader.linkedin}" target="_blank" rel="noopener noreferrer" aria-label="${leader.name} on LinkedIn"><i class="fab fa-linkedin"></i></a>`
        : ``;

      return `
        <div class="col-6 col-md-4 col-lg-3 col-xl-2 reveal">
          <div class="leader-card">
            <div class="leader-card__img-wrap">
              ${imgTag}
            </div>
            <div class="leader-card__body">
              <div class="leader-card__name">${leader.name}</div>
              <div class="leader-card__role">${leader.role}</div>
              <div class="leader-card__major">${leader.major || ""}</div>
              ${linkedIn}
            </div>
          </div>
        </div>
      `;
    }

    function renderSection(gridId, leaders) {
      document.getElementById(gridId).innerHTML = leaders.map(leaderCardHTML).join("");
    }

    renderSection("exec-grid", LEADERS.exec);
    renderSection("directors-grid", LEADERS.directors);
    renderSection("chairs-grid", LEADERS.chairs);

    /* ===================================================
       LAZY LOAD + SCROLL REVEAL
       =================================================== */
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        entry.target.classList.add("is-visible");
        const img = entry.target.querySelector("img[data-src]");
        if (img && !img.src) {
          img.src = img.getAttribute("data-src");
          img.onload = () => img.classList.add("loaded");
        }
        io.unobserve(entry.target);
      });
    }, { threshold: 0, rootMargin: "0px 0px 400px 0px" });

    document.querySelectorAll(".reveal").forEach(el => io.observe(el));
