    /* ===================================================
       RENDER
       =================================================== */
    function leaderCardHTML(leader) {
      const imgTag = leader.img
        ? `<img class="leader-card__photo" data-src="${leader.img}" alt="${leader.name}" loading="lazy" decoding="async">`
        : `<div class="avatar-placeholder"><i class="fa-solid fa-user" aria-hidden="true"></i></div>`;

      const linkedIn = leader.linkedin
        ? `<a class="leader-card__linkedin" href="${leader.linkedin}" target="_blank" rel="noopener noreferrer" aria-label="${leader.name} on LinkedIn" onclick="event.stopPropagation()"><i class="fab fa-linkedin"></i></a>`
        : ``;

      return `
        <div class="col-6 col-md-4 col-lg-3 col-xl-2 reveal">
          <div class="leader-card"
            data-leader-id="${leader.id}"
            tabindex="0"
            role="button"
            aria-label="View ${leader.name} profile">
            <div class="leader-card__img-wrap">
              ${imgTag}
            </div>
            <div class="leader-card__body">
              <div class="leader-card__name">${leader.name}</div>
              <div class="leader-card__role">${leader.role}</div>
              <div class="leader-card__major">${leader.major || ""}</div>
              ${linkedIn}
            </div>
          </div>
        </div>
      `;
    }

    function renderSection(gridId, leaders) {
      document.getElementById(gridId).innerHTML = leaders.map(leaderCardHTML).join("");
    }

    renderSection("exec-grid", LEADERS.exec);
    renderSection("directors-grid", LEADERS.directors);
    renderSection("chairs-grid", LEADERS.chairs);

    /* ===================================================
       LAZY LOAD + SCROLL REVEAL
       =================================================== */
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        entry.target.classList.add("is-visible");
        const img = entry.target.querySelector("img[data-src]");
        if (img && !img.src) {
          img.src = img.getAttribute("data-src");
          img.onload = () => img.classList.add("loaded");
        }
        io.unobserve(entry.target);
      });
    }, { threshold: 0, rootMargin: "0px 0px 400px 0px" });

    document.querySelectorAll(".reveal").forEach(el => io.observe(el));

    /* ===================================================
       MODAL
       =================================================== */
    const modal    = new bootstrap.Modal(document.getElementById("leaderModal"));
    const titleEl  = document.getElementById("leaderModalTitle");
    const bodyEl   = document.getElementById("leaderModalBody");
    const leaderMap = {};
    [...LEADERS.exec, ...LEADERS.directors, ...LEADERS.chairs].forEach(l => leaderMap[l.id] = l);

    function qaToHTML(qa) {
      const keys = qa ? Object.keys(qa) : [];
      if (keys.length === 0) return `<p class="text-muted mb-0">More info coming soon.</p>`;
      return keys.map(q => `
        <div class="qa-q">${q}</div>
        <div class="qa-a">${qa[q]}</div>
      `).join("");
    }

    function openModal(id) {
      const leader = leaderMap[id];
      if (!leader) return;
      titleEl.textContent = `${leader.role}, ${leader.name}`;
      bodyEl.innerHTML = `
        <div class="d-flex flex-column flex-md-row gap-4 align-items-start">
          <div style="min-width: 150px;">
            ${leader.img
              ? `<img src="${leader.img}" alt="${leader.name}" class="rounded-4" style="width:150px;height:150px;object-fit:cover;">`
              : ``}
          </div>
          <div class="flex-grow-1">
            <p class="text-muted mb-3" style="font-family:var(--font-body);">${leader.major || ""}</p>
            ${qaToHTML(leader.qa)}
          </div>
        </div>
      `;
      modal.show();
    }

    document.addEventListener("click", e => {
      const card = e.target.closest(".leader-card");
      if (card) openModal(card.getAttribute("data-leader-id"));
    });

    document.addEventListener("keydown", e => {
      if (e.key !== "Enter" && e.key !== " ") return;
      const card = e.target.closest(".leader-card[role='button']");
      if (card) { e.preventDefault(); openModal(card.getAttribute("data-leader-id")); }
    });
